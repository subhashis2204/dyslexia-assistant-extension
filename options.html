<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-bg: #f8fafc;
        --color-surface: #ffffff;
        --color-text-primary: #0f172a;
        --color-text-secondary: #64748b;
        --color-border: #e2e8f0;
        --color-accent: #2563eb;
        --color-accent-hover: #1d4ed8;
        --color-success: #10b981;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 60px 20px;
        color: var(--color-text-primary);
        font-family:
          "Plus Jakarta Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        background: radial-gradient(
          circle at 50% 0%,
          #eff6ff 0%,
          var(--color-bg) 75%
        );
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 460px);
        margin: 0 auto;
        padding: 36px;
        border: 1px solid var(--color-border);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        box-shadow:
          0 20px 25px -5px rgba(15, 23, 42, 0.05),
          0 8px 10px -6px rgba(15, 23, 42, 0.01);
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--color-accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .intro {
        margin: 8px 0 28px;
        color: var(--color-text-secondary);
        font-size: 14px;
        line-height: 1.5;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: var(--color-text-primary);
        font-size: 12px;
        font-weight: 700;
      }

      input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--color-border);
        border-radius: 10px;
        color: var(--color-text-primary);
        font-family: inherit;
        font-size: 13px;
        background: #f8fafc;
        transition: all 0.15s ease;
      }

      input::placeholder {
        color: #94a3b8;
      }

      input:focus {
        outline: none;
        border-color: var(--color-accent);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }

      button {
        width: 100%;
        padding: 12px 18px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        color: #ffffff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        background: var(--color-accent);
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        transition: all 0.15s ease;
      }

      button:hover {
        background: var(--color-accent-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      #status {
        min-height: 20px;
        margin-top: 14px;
        color: var(--color-success);
        font-size: 13px;
        font-weight: 600;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Dyslexia AI Assistant</p>
      <h1>Connect Azure OpenAI</h1>
      <p class="intro">
        Configure your deployment settings to enable AI summaries and rewrites.
      </p>

      <div class="form-group">
        <label for="endpoint">Endpoint URL</label>
        <input
          type="text"
          id="endpoint"
          placeholder="https://my-resource.openai.azure.com"
        />
      </div>

      <div class="form-group">
        <label for="deployment">Deployment name</label>
        <input type="text" id="deployment" placeholder="gpt-4o-mini-deploy" />
      </div>

      <div class="form-group">
        <label for="apiKey">API key</label>
        <input type="password" id="apiKey" placeholder="Azure API Key" />
      </div>

      <button id="saveBtn">Save settings</button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>

    <script src="options.js"></script>
  </body>
</html>
